server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/secureapi
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

app:
  jwt:
    secret: "CHANGE_ME_super_long_secret_key_at_least_32_bytes_1234567890"
    expiration-ms: 3600000  # 1 час